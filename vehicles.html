<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicles - SpaceX</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    /* VEHICLES HERO */
.vehicles-hero {
    position: relative;
    height: 60vh;
    background: url("https://img.freepik.com/free-photo/exploration-settlements-different-planets_23-2151768636.jpg?semt=ais_hybrid&w=740&q=80") no-repeat center/cover;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.vehicles-hero .overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
}

.hero-content {
    position: relative;
    z-index: 2;
}

.hero-content h1 {
    font-size: 60px;
    letter-spacing: 4px;
}

/* VEHICLE GRID */
.vehicles-grid {
    background: #000;
    padding: 80px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 40px;
}

.vehicle-card {
    position: relative;
    overflow: hidden;
    cursor: pointer;
}

.vehicle-card img {
    width: 100%;
    height: 400px;
    object-fit: cover;
    transition: 0.5s;
}

.vehicle-card h2 {
    position: absolute;
    bottom: 30px;
    left: 30px;
    color: white;
    font-size: 24px;
    letter-spacing: 2px;
}

.vehicle-card:hover img {
    transform: scale(1.1);
}

/* Responsive */
@media (max-width: 768px) {
    .hero-content h1 {
        font-size: 40px;
    }

    .vehicles-grid {
        padding: 40px 20px;
    }
}

</style>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="logo">
            <img src="spacex_logo_transparent.png" alt="SpaceX Logo">
        </div>

        <ul class="nav-links">
            <li><a href="vehicles.html">VEHICLES</a></li>
            <li><a href="#">HUMAN SPACE</a></li>
            <li><a href="#">STARLINK</a></li>
            <li><a href="#">STARSHIELD</a></li>
            <li><a href="#">xAI</a></li>
            <li><a href="#">COMPANY</a></li>
            <li><a href="#">SHOP</a></li>
        </ul>
    </nav>

    <!-- HERO SECTION -->
    <section class="vehicles-hero">
        <div class="overlay"></div>
        <div class="hero-content">
            <h1>VEHICLES</h1>
        </div>
    </section>

    <!-- VEHICLE GRID -->
    <section class="vehicles-grid">

        <div class="vehicle-card">
            <img src="https://www.spacex.com/assets/images/vehicles/starship/mobile/starship_carousel2_card4_v2_m.jpg" alt="Starship">
            <h2>STARSHIP</h2>
        </div>

        <div class="vehicle-card">
            <img src="https://storage.googleapis.com/nextspaceflight/media/rockets/Falcon_9_Block_5.webp" alt="Falcon 9">
            <h2>FALCON 9</h2>
        </div>

        <div class="vehicle-card">
            <img src="https://www.spacex.com/assets/images/vehicles/falcon-heavy/mobile/FH_5_mobile.jpg" alt="Falcon Heavy">
            <h2>FALCON HEAVY</h2>
        </div>

        <div class="vehicle-card">
            <img src="https://images.newscientist.com/wp-content/uploads/2014/05/dn25652-2_800.jpg" alt="Dragon">
            <h2>DRAGON</h2>
        </div>

    </section>

</body>
</html>
